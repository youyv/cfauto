# ============================================
# Cloudflare Worker 部署配置文件
# 修改下方配置后双击 deploy.bat 即可推送
# ============================================

# ---------- 项目名称 ----------
# 必须与 Cloudflare 上已创建的 Worker 名称一致
# 例如在 CF 创建了名为 "manager" 的 Worker，这里就填 "manager"
name = "改成你的Worker名"
# account_id = "改成你的Account ID"     # 要部署到哪个 CF 账号 (取消注释并填写)

# ---------- 入口文件 ----------
# 由 build.bat 生成，无需修改
main = "dist/worker.js"

# ---------- 兼容日期 ----------
# 每次 build.bat 自动更新为当天日期，无需手动改
compatibility_date = "2026-07-16"

# workers_dev = false                                           # 禁用 *.workers.dev 默认域名
# preview_urls = false                                       # 禁用预览 URL

# ==========================================
#              KV 命名空间绑定
# ==========================================
# KV 空间首次部署时取消注释，填入你的 KV ID (CF后台查看)
# [[kv_namespaces]]
# binding = "CONFIG_KV"
# id = "改成你的KV ID"

# ==========================================
#              环境变量 (密钥)
# ==========================================
# 密钥在 CF 后台 Setting → Variables 手动设置一次即可
# wrangler.toml 不写 [vars]，日常 deploy 不会覆盖后台已设的值
# 密钥用 wrangler secret 管理，不写明文，日常 deploy 不会覆盖
# 设置方法：双击 setup-secrets.bat（推荐，会自动带上 -c wrangler.local.toml）
#          或手动执行 node_modules\.bin\wrangler secret put ACCESS_CODE

# ==========================================
#              路由 & 触发器
# ==========================================
# 自定义域名路由 (有自定义域名时取消注释)
# [[routes]]
# pattern = "改成你的域名"
# custom_domain = true
# 用 zone_id 而不是 zone_name：wrangler 会直接使用该 ID，不再查 /zones?name=...，
# 这样部署用的 API Token 无需额外的 Zone:Zone:Read 权限。
# zone_id = "在 CF 后台域名 Overview 右侧栏可查看"
# zone_name = "改成你的zone名"   # 若填 zone_name，则 token 还需 Zone:Zone:Read

# Cron 定时触发器 (自动更新 & 熔断, 需要时取消注释)
# [triggers]
# crons = ["*/5 * * * *"]

# ==========================================
#              构建命令
# ==========================================
# 本地上传时先打包，无需手动 build.bat。
# 这里刻意用 `node build.js` 而不是 `pnpm run build`：pnpm 在跑脚本前会做一次依赖状态
# 检查，一旦 node_modules 与 package.json 记录的包管理器版本不一致，它会要求删除并重装
# node_modules，而非交互环境下会以 ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY 直接失败，
# 连带把整次部署拖垮。build.js 本身只依赖 node + node_modules，不需要经过包管理器。
[build]
command = "node build.js"

# ==========================================
#              日志观测
# ==========================================
[observability]
enabled = true                                            # 开启 Worker 日志 (可在 CF 后台查看)

name: CI

# 每次 push 与 PR 都跑完整校验链：build → typecheck → verify → test。
# 顺序有依赖：build 生成 src/frontend-bundle.ts，typecheck 需要它才能通过。
#
# 包管理器用 pnpm：仓库里只有 pnpm-lock.yaml，用 npm 会因为找不到
# package-lock.json 而在 setup-node 的缓存步骤直接失败。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # pnpm 必须先装：setup-node 的 cache: pnpm 需要 pnpm 已在 PATH 中
      # 才能解析出 store 路径。版本由 package.json 的 packageManager 字段决定。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      # --ignore-scripts: esbuild / workerd / sharp 的 postinstall 在 CI 里不需要
      # （esbuild 通过 @esbuild/<platform> 可选依赖直接拿到二进制），跳过可避免
      # 下载失败拖垮整个流程。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Local code gates (one build/type/verify/test pipeline)
        run: pnpm check

      - name: Install Chromium for browser regressions
        run: pnpm exec playwright install --with-deps chromium --only-shell

      - name: Browser regressions (mock API only)
        run: pnpm run test:e2e

      - name: Install cross-engine test browsers
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Cross-engine critical interactions (mock API only)
        run: pnpm exec playwright test -c playwright.cross-browser.config.cjs

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: 确认仓库未被构建过程改动
        run: |
          # frontend-bundle.ts 与 dist/ 都在 .gitignore 中，不应出现在 diff 里。
          # wrangler.toml 的 compatibility_date 由 build.js 同步为固定常量，
          # 若这里出现改动说明常量与仓库中的值不一致，应显式提交。
          if ! git diff --quiet; then
            echo "::error::构建过程修改了被跟踪的文件，请提交这些改动"
            git diff --stat
            exit 1
          fi

      - name: Preserve verified build (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: verified-worker-${{ github.sha }}
          path: |
            dist/worker.js
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: 构建身份摘要（不代表已部署）
        run: |
          echo '### 已校验构建，未执行部署' >> "$GITHUB_STEP_SUMMARY"
          echo '实际 checkout 提交以清单为准；PR 可能为合并测试提交。' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/build-manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
